<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab Master - Изучение немецкого языка</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇩🇪</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #00d4ff;
            --primary-dark: #0099cc;
            --success: #00ff88;
            --warning: #ffaa00;
            --error: #ff4444;
            --bg-dark: #0a0a0a;
            --bg-card: rgba(255,255,255,0.05);
            --text-light: #b0b0b0;
            --text-white: #ffffff;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark), #1a1a2e);
            color: var(--text-white);
            overflow-x: hidden;
            min-height: 100vh;
            line-height: 1.6;
        }
        
        #app {
            min-height: 100vh;
        }
        
        /* Loading Screen */
        .loading {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, var(--bg-dark), #1a1a2e);
            gap: 20px;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255,255,255,0.1);
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Header */
        .header {
            background: rgba(26, 26, 46, 0.95);
            border-bottom: 1px solid rgba(0, 212, 255, 0.3);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-text {
            font-size: 22px;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary);
            font-size: 14px;
        }
        
        /* Main Content */
        .main-content {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            padding-bottom: 80px;
        }
        
        .card {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }
        
        h1 {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 28px;
            margin-bottom: 16px;
        }
        
        h2 {
            color: var(--text-white);
            font-size: 22px;
            margin-bottom: 16px;
        }
        
        h3 {
            color: var(--text-white);
            font-size: 18px;
            margin-bottom: 12px;
        }
        
        p {
            color: var(--text-light);
            margin-bottom: 16px;
        }
        
        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--text-white);
        }
        
        .btn-secondary {
            background: rgba(42, 42, 42, 0.7);
            color: var(--text-white);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .btn-success {
            background: linear-gradient(135deg, var(--success), #00cc6a);
            color: var(--text-white);
        }
        
        .btn-warning {
            background: linear-gradient(135deg, var(--warning), #cc8800);
            color: var(--text-white);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, var(--error), #cc3636);
            color: var(--text-white);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        /* Grid Layouts */
        .grid {
            display: grid;
            gap: 16px;
            margin-top: 20px;
        }
        
        .grid-2 {
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        }
        
        .grid-3 {
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        }
        
        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        
        .stat {
            text-align: center;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
        }
        
        .stat-label {
            font-size: 13px;
            color: var(--text-light);
            margin-top: 5px;
        }
        
        /* Navigation */
        .navigation {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(26, 26, 46, 0.95);
            border-top: 1px solid rgba(0, 212, 255, 0.3);
            padding: 12px 20px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        
        .nav-content {
            display: flex;
            justify-content: space-around;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
            border-radius: 10px;
            min-width: 70px;
        }
        
        .nav-item.active {
            color: var(--primary);
            background: rgba(0, 212, 255, 0.1);
        }
        
        .nav-icon {
            font-size: 20px;
        }
        
        /* Topic Cards */
        .topic-card {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .topic-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 10px 25px rgba(0, 212, 255, 0.2);
        }
        
        .topic-icon {
            font-size: 36px;
            margin-bottom: 12px;
        }
        
        .topic-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--text-white);
        }
        
        .topic-count {
            font-size: 14px;
            color: var(--text-light);
        }
        
        /* Word Cards */
        .word-card {
            text-align: center;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 12px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .word-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        
        .word-original {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--primary);
        }
        
        .word-translation {
            font-size: 18px;
            color: var(--text-light);
        }
        
        /* Flip Cards */
        .flip-card {
            perspective: 1000px;
            cursor: pointer;
            height: 180px;
        }
        
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            border-radius: 12px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .flip-card-back {
            transform: rotateY(180deg);
            background: rgba(0, 212, 255, 0.1);
        }
        
        .pronunciation-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
            padding: 8px;
            border-radius: 50%;
        }
        
        .pronunciation-btn:hover {
            background: rgba(0, 212, 255, 0.1);
            transform: scale(1.1);
        }
        
        /* Test Styles */
        .test-word {
            text-align: center;
            padding: 30px;
            background: rgba(255,255,255,0.02);
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .test-options {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .option-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(42, 42, 42, 0.7);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: var(--text-white);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }
        
        .option-btn:hover {
            background: rgba(60, 60, 60, 0.7);
            transform: translateY(-2px);
        }
        
        .option-btn.correct {
            background: rgba(0, 255, 136, 0.2);
            border-color: var(--success);
        }
        
        .option-btn.incorrect {
            background: rgba(255, 68, 68, 0.2);
            border-color: var(--error);
        }
        
        .option-status {
            font-size: 18px;
            margin-left: 10px;
        }
        
        .test-input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(42, 42, 42, 0.7);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: var(--text-white);
            font-size: 16px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        
        .test-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }
        
        .test-input.correct {
            border-color: var(--success);
            background: rgba(0, 255, 136, 0.1);
        }
        
        .test-input.incorrect {
            border-color: var(--error);
            background: rgba(255, 68, 68, 0.1);
        }
        
        .test-input.acceptable {
            border-color: var(--warning);
            background: rgba(255, 170, 0, 0.1);
        }
        
        .test-result {
            text-align: center;
            padding: 20px;
        }
        
        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            margin-bottom: 10px;
            background: rgba(42, 42, 42, 0.7);
            border-radius: 10px;
            border-left: 4px solid transparent;
        }
        
        .result-item.correct {
            border-left-color: var(--success);
        }
        
        .result-item.incorrect {
            border-left-color: var(--error);
        }
        
        .result-item.acceptable {
            border-left-color: var(--warning);
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            margin: 20px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            transition: width 0.5s ease;
        }
        
        /* Settings */
        .settings-panel {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            margin-top: 16px;
        }
        
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(255,255,255,0.03);
        }
        
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #333;
            transition: .4s;
            border-radius: 24px;
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .toggle-slider {
            background-color: var(--primary);
        }
        
        input:checked + .toggle-slider:before {
            transform: translateX(26px);
        }
        
        /* Utility Classes */
        .hidden {
            display: none !important;
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        
        .text-center {
            text-align: center;
        }
        
        .mb-0 {
            margin-bottom: 0;
        }
        
        .mt-20 {
            margin-top: 20px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Media Queries */
        @media (max-width: 768px) {
            .main-content {
                padding: 15px;
                padding-bottom: 80px;
            }
            
            .card {
                padding: 20px;
            }
            
            .grid-2, .grid-3 {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .word-original {
                font-size: 24px;
            }
            
            .flip-card {
                height: 160px;
            }
            
            .header-content {
                padding: 0 10px;
            }
        }
        
        @media (max-width: 480px) {
            .main-content {
                padding: 10px;
                padding-bottom: 80px;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .nav-item {
                font-size: 11px;
                padding: 6px 10px;
                min-width: 60px;
            }
            
            .nav-icon {
                font-size: 18px;
            }
            
            .flip-card {
                height: 140px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            h2 {
                font-size: 20px;
            }
        }
        
        @media (max-width: 360px) {
            .logo-text {
                font-size: 18px;
            }
            
            .user-info {
                font-size: 12px;
            }
            
            .nav-item {
                font-size: 10px;
                padding: 4px 8px;
            }
        }
    </style>
</head>

        // ==================== НАСТРОЙКИ ПРИЛОЖЕНИЯ ====================
        const DEFAULT_SETTINGS = {

        // ==================== СОСТОЯНИЕ ПРИЛОЖЕНИЯ ====================
        const AppState = {

        // ==================== УТИЛИТЫ ====================
        const Utils = {
            // Загрузка данных из localStorage
            loadFromStorage(key, defaultValue = null) {
                try {
                    const item = localStorage.getItem(key);
                    return item ? JSON.parse(item) : defaultValue;
                } catch (error) {
                    console.error(`Ошибка загрузки ${key}:`, error);
                    return defaultValue;
                }
            },

            // Сохранение данных в localStorage
            saveToStorage(key, value) {
                try {
                    localStorage.setItem(key, JSON.stringify(value));
                    return true;
                } catch (error) {
                    console.error(`Ошибка сохранения ${key}:`, error);
                    return false;
                }
            },

            // Перемешивание массива
            shuffleArray(array) {
                const shuffled = [...array];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled;
            },

            // Проверка ответа с допущением ошибок
            isAnswerAcceptable(userAnswer, correctAnswer) {
                userAnswer = userAnswer.toLowerCase().trim();
                correctAnswer = correctAnswer.toLowerCase().trim();
                
                if (userAnswer === correctAnswer) {
                    return { acceptable: true, exact: true };
                }
                
                // Допускаем 1 ошибку (опечатку)
                if (Math.abs(userAnswer.length - correctAnswer.length) > 1) {
                    return { acceptable: false, exact: false };
                }
                
                // Простая проверка расстояния Левенштейна (для 1 ошибки)
                let errors = 0;
                const minLength = Math.min(userAnswer.length, correctAnswer.length);
                
                for (let i = 0; i < minLength; i++) {
                    if (userAnswer[i] !== correctAnswer[i]) {
                        errors++;
                        if (errors > 1) return { acceptable: false, exact: false };
                    }
                }
                
                // Если разница в длине - это дополнительная ошибка
                if (userAnswer.length !== correctAnswer.length) {
                    errors++;
                }
                
                return { 
                    acceptable: errors <= 1, 
                    exact: false,
                    suggestion: correctAnswer
                };
            },

            // Произношение слова
            speakWord(text, lang = 'de-DE') {
                if (!AppState.settings.soundEnabled) return;
                
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = lang;
                    utterance.rate = 0.8;
                    utterance.pitch = 1;
                    window.speechSynthesis.speak(utterance);
                }
            },

            // Получение всех слов
            getAllWords() {
                let allWords = [];
                for (const topicKey in WORD_TOPICS) {
                    allWords = allWords.concat(WORD_TOPICS[topicKey].words);
                }
                return allWords;
            },

            // Получение описания типа теста
            getTestTypeDescription(type) {
                const descriptions = {
                    'choice': 'Тест с выбором ответа',
                    'writing': 'Письменный тест',
                    'reverse': 'Перевод с русского на немецкий'
                };
                return descriptions[type] || 'Тест';
            }
        };

        // ==================== УПРАВЛЕНИЕ ПРОГРЕССОМ ====================
        const ProgressManager = {
            // Загрузка прогресса
            loadProgress() {
                return Utils.loadFromStorage('vocabMasterProgress', {
                    learnedWords: [],
                    testResults: [],
                    totalTests: 0,
                    averageScore: 0,
                    topicProgress: {},
                    totalStudyTime: 0,
                    wordsLearned: 0
                });
            },

            // Сохранение прогресса
            saveProgress() {
                return Utils.saveToStorage('vocabMasterProgress', AppState.userProgress);
            },

            // Обновление статистики после теста
            updateTestStats() {
                AppState.userProgress.totalTests++;
                
                const accuracy = (AppState.score / AppState.testResults.length) * 100;
                const totalScore = AppState.userProgress.averageScore * (AppState.userProgress.totalTests - 1) + accuracy;
                AppState.userProgress.averageScore = totalScore / AppState.userProgress.totalTests;
                
                // Добавляем результат теста
                AppState.userProgress.testResults.push({
                    date: new Date().toISOString(),
                    score: AppState.score,
                    total: AppState.testResults.length,
                    accuracy: Math.round(accuracy),
                    topic: AppState.currentTopic,
                    type: AppState.testType,
                    mode: AppState.testMode
                });
                
                // Сохраняем только последние 20 результатов
                if (AppState.userProgress.testResults.length > 20) {
                    AppState.userProgress.testResults = AppState.userProgress.testResults.slice(-20);
                }
                
                this.saveProgress();
            },

            // Получение последних результатов
            getRecentResults(limit = 3) {
                return AppState.userProgress.testResults
                    .slice(-limit)
                    .reverse();
            }
        };

        // ==================== УПРАВЛЕНИЕ НАСТРОЙКАМИ ====================
        const SettingsManager = {
            // Загрузка настроек
            loadSettings() {
                return Utils.loadFromStorage('vocabMasterSettings', DEFAULT_SETTINGS);
            },

            // Сохранение настроек
            saveSettings() {
                return Utils.saveToStorage('vocabMasterSettings', AppState.settings);
            },

            // Обновление настройки
            updateSetting(key, value) {
                AppState.settings[key] = value;
                this.saveSettings();
            }
        };

        // ==================== СИСТЕМА ТЕСТИРОВАНИЯ ====================
        const TestSystem = {
            // Начало теста
            startTest(mode, topicId = null) {
                AppState.testMode = mode;
                
                // Выбор слов для теста
                if (topicId) {
                    AppState.currentTest = Utils.shuffleArray([...WORD_TOPICS[topicId].words]);
                    AppState.currentTopic = topicId;
                } else if (mode === 'difficult') {
                    AppState.currentTest = Utils.shuffleArray(Utils.getAllWords()).slice(0, 10);
                    AppState.currentTopic = 'all';
                } else {
                    AppState.currentTest = Utils.shuffleArray(Utils.getAllWords());
                    AppState.currentTopic = 'all';
                }
                
                AppState.currentWordIndex = 0;
                AppState.score = 0;
                AppState.incorrectAnswers = [];
                AppState.testResults = [];
                
                this.showTestQuestion();
            },

            // Показать вопрос теста
            showTestQuestion() {
                if (AppState.currentWordIndex >= AppState.currentTest.length) {
                    if (AppState.testMode === 'untilCorrect' && AppState.incorrectAnswers.length > 0) {
                        AppState.currentTest = [...AppState.incorrectAnswers];
                        AppState.currentWordIndex = 0;
                        AppState.incorrectAnswers = [];
                    } else {
                        ProgressManager.updateTestStats();
                        this.showTestResults();
                        return;
                    }
                }
                
                const currentWord = AppState.currentTest[AppState.currentWordIndex];
                
                switch (AppState.testType) {
                    case 'choice':
                        this.showChoiceTest(currentWord);
                        break;
                    case 'writing':
                        this.showWritingTest(currentWord);
                        break;
                    case 'reverse':
                        this.showReverseTest(currentWord);
                        break;
                }
            },

            // Тест с выбором ответа
            showChoiceTest(word) {
                const options = [word.translation];
                const allWords = AppState.currentTopic && AppState.currentTopic !== 'all' ? 
                    WORD_TOPICS[AppState.currentTopic].words : Utils.getAllWords();
                
                const otherWords = allWords
                    .filter(w => w.id !== word.id)
                    .sort(() => Math.random() - 0.5)
                    .slice(0, 3)
                    .map(w => w.translation);
                
                const allOptions = Utils.shuffleArray([...options, ...otherWords]);
                const topic = AppState.currentTopic && AppState.currentTopic !== 'all' ? 
                    WORD_TOPICS[AppState.currentTopic] : null;
                
                const app = document.getElementById('app');
                app.innerHTML = this.generateTestHTML(word, allOptions, topic);
                
                document.getElementById('answer-input')?.focus();
            },

            // Письменный тест
            showWritingTest(word) {
                const topic = AppState.currentTopic && AppState.currentTopic !== 'all' ? 
                    WORD_TOPICS[AppState.currentTopic] : null;
                
                const app = document.getElementById('app');
                app.innerHTML = this.generateWritingTestHTML(word, topic);
                document.getElementById('answer-input').focus();
            },

            // Обратный тест
            showReverseTest(word) {
                const topic = AppState.currentTopic && AppState.currentTopic !== 'all' ? 
                    WORD_TOPICS[AppState.currentTopic] : null;
                
                const app = document.getElementById('app');
                app.innerHTML = this.generateReverseTestHTML(word, topic);
                document.getElementById('answer-input').focus();
            },

            // Проверка ответа в тесте с выбором
            checkChoiceAnswer(selected, correct) {
                const options = document.querySelectorAll('.option-btn');
                const nextBtn = document.getElementById('next-btn');
                
                options.forEach(option => {
                    const optionText = option.querySelector('span:first-child').textContent;
                    const status = option.querySelector('.option-status');
                    
                    option.style.pointerEvents = 'none';
                    
                    if (optionText === correct) {
                        option.classList.add('correct');
                        status.innerHTML = '✓';
                        status.style.color = 'var(--success)';
                    }
                    
                    if (optionText === selected && optionText !== correct) {
                        option.classList.add('incorrect');
                        status.innerHTML = '✗';
                        status.style.color = 'var(--error)';
                    }
                });
                
                const isCorrect = selected === correct;
                this.recordTestResult(isCorrect, selected, correct);
                
                if (isCorrect) {
                    AppState.score++;
                } else {
                    AppState.incorrectAnswers.push(AppState.currentTest[AppState.currentWordIndex]);
                }
                
                nextBtn.classList.remove('hidden');
            },

            // Проверка письменного ответа
            checkWritingAnswer() {
                const input = document.getElementById('answer-input');
                const resultMessage = document.getElementById('result-message');
                const nextBtn = document.getElementById('next-btn');
                const currentWord = AppState.currentTest[AppState.currentWordIndex];
                
                const userAnswer = input.value.trim();
                const correctAnswer = currentWord.translation;
                const checkResult = Utils.isAnswerAcceptable(userAnswer, correctAnswer);
                
                this.handleAnswerResult(input, resultMessage, checkResult, userAnswer, correctAnswer);
                nextBtn.classList.remove('hidden');
            },

            // Проверка ответа в обратном тесте
            checkReverseAnswer() {
                const input = document.getElementById('answer-input');
                const resultMessage = document.getElementById('result-message');
                const nextBtn = document.getElementById('next-btn');
                const currentWord = AppState.currentTest[AppState.currentWordIndex];
                
                const userAnswer = input.value.trim();
                const correctAnswer = currentWord.original;
                const checkResult = Utils.isAnswerAcceptable(userAnswer, correctAnswer);
                
                this.handleAnswerResult(input, resultMessage, checkResult, userAnswer, correctAnswer);
                nextBtn.classList.remove('hidden');
            },

            // Обработка результата ответа
            handleAnswerResult(input, resultMessage, checkResult, userAnswer, correctAnswer) {
                const currentWord = AppState.currentTest[AppState.currentWordIndex];
                
                if (checkResult.exact) {
                    input.classList.add('correct');
                    resultMessage.innerHTML = '<p style="color: var(--success);">✓ Правильно!</p>';
                    AppState.score++;
                } else if (checkResult.acceptable) {
                    input.classList.add('acceptable');
                    resultMessage.innerHTML = `
                        <p style="color: var(--warning);">⚠ Почти правильно!</p>
                        <p style="color: var(--success);">Правильнее: ${correctAnswer}</p>
                    `;
                    AppState.score++;
                } else {
                    input.classList.add('incorrect');
                    resultMessage.innerHTML = `
                        <p style="color: var(--error);">✗ Неправильно</p>
                        <p style="color: var(--success);">Правильный ответ: ${correctAnswer}</p>
                    `;
                    AppState.incorrectAnswers.push(currentWord);
                }
                
                this.recordTestResult(checkResult.exact || checkResult.acceptable, userAnswer, correctAnswer);
                input.disabled = true;
            },

            // Запись результата теста
            recordTestResult(isCorrect, selected, correct) {
                AppState.testResults.push({
                    word: AppState.currentTest[AppState.currentWordIndex],
                    selected,
                    correct,
                    isCorrect,
                    acceptable: isCorrect
                });
            },

            // Следующий вопрос
            nextQuestion() {
                AppState.currentWordIndex++;
                this.showTestQuestion();
            },

            // Показать результаты теста
            showTestResults() {
                const accuracy = Math.round((AppState.score / AppState.testResults.length) * 100);
                const topic = AppState.currentTopic && AppState.currentTopic !== 'all' ? 
                    WORD_TOPICS[AppState.currentTopic] : null;
                
                let resultEmoji, resultText;
                if (accuracy >= 90) {
                    resultEmoji = '🎉';
                    resultText = 'Отлично!';
                } else if (accuracy >= 70) {
                    resultEmoji = '👍';
                    resultText = 'Хорошо!';
                } else if (accuracy >= 50) {
                    resultEmoji = '💪';
                    resultText = 'Неплохо!';
                } else {
                    resultEmoji = '📚';
                    resultText = 'Продолжайте учиться!';
                }
                
                const app = document.getElementById('app');
                app.innerHTML = this.generateResultsHTML(accuracy, resultEmoji, resultText, topic);
            },

            // Генерация HTML для тестов (вспомогательные методы)
            generateTestHTML(word, options, topic) {
                return `
                    <header class="header">
                        <div class="header-content">
                            <div class="logo-text">${topic ? topic.icon + ' ' + topic.name : '🎯 Тест'}</div>
                            <div style="color: var(--primary);">
                                ${AppState.currentWordIndex + 1}/${AppState.currentTest.length}
                            </div>
                        </div>
                    </header>

                    <main class="main-content">
                        <div class="test-word fade-in">
                            <h1 style="font-size: 36px; margin-bottom: 10px;">${word.original}</h1>
                            <p style="color: var(--text-light);">Переведите на русский</p>
                            <button class="pronunciation-btn" onclick="Utils.speakWord('${word.original}')" style="margin-top: 15px;">
                                🔊 Произнести
                            </button>
                        </div>

                        <div class="test-options" id="options-container">
                            ${options.map(option => `
                                <button class="option-btn fade-in" onclick="TestSystem.checkChoiceAnswer('${option.replace(/'/g, "\\'")}', '${word.translation.replace(/'/g, "\\'")}')">
                                    <span>${option}</span>
                                    <span class="option-status"></span>
                                </button>
                            `).join('')}
                        </div>

                        <button class="btn btn-primary hidden" id="next-btn" onclick="TestSystem.nextQuestion()">
                            ➡️ Следующее слово
                        </button>

                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${(AppState.currentWordIndex / AppState.currentTest.length) * 100}%"></div>
                        </div>
                    </main>
                    ${this.generateNavigation()}
                `;
            },

            generateWritingTestHTML(word, topic) {
                return `
                    <header class="header">
                        <div class="header-content">
                            <div class="logo-text">✏️ Письменный тест</div>
                            <div style="color: var(--primary);">
                                ${AppState.currentWordIndex + 1}/${AppState.currentTest.length}
                            </div>
                        </div>
                    </header>

                    <main class="main-content">
                        <div class="test-word fade-in">
                            <h1 style="font-size: 36px; margin-bottom: 10px;">${word.original}</h1>

                            </button>

                        <button class="btn btn-primary hidden" id="next-btn" onclick="TestSystem.nextQuestion()">➡️ Следующее слово</button>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${(AppState.currentWordIndex / AppState.currentTest.length) * 100}%"></div>
                        </div>
                    </main>
                    ${this.generateNavigation()}
                `;
            },

            generateReverseTestHTML(word, topic) {
                return `
                    <header class="header">
                        <div class="header-content">
                            <div class="logo-text">🔄 Обратный тест</div>
                            <div style="color: var(--primary);">
                                ${AppState.currentWordIndex + 1}/${AppState.currentTest.length}
                            </div>
                        </div>
                    </header>

                    <main class="main-content">
                        <div class="test-word fade-in">
                            <h1 style="font-size: 36px; margin-bottom: 10px;">${word.translation}</h1>
                            <p style="color: var(--text-light);">Напишите перевод на немецком</p>
                        </div>

                        <div id="result-message"></div>
                        <button class="btn btn-primary hidden" id="next-btn" onclick="TestSystem.nextQuestion()">➡️ Следующее слово</button>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${(AppState.currentWordIndex / AppState.currentTest.length) * 100}%"></div>
                        </div>
                    </main>
                    ${this.generateNavigation()}
                `;
            },

            generateResultsHTML(accuracy, emoji, text, topic) {
                return `
                    <header class="header">

                            <div class="logo-text">📊 Результаты${topic ? ': ' + topic.name : ''}</div>
                            <button onclick="UI.showMainPage()" style="background: none; border: none; color: var(--primary); cursor: pointer; font-size: 18px;">🏠</button>
                        </div>
                    </header>

                    <main class="main-content">
                        <div class="card fade-in">
                            <div class="test-result">
                                <h1>${emoji} ${text}</h1>
                                <p>Результаты теста${topic ? ' по теме "' + topic.name + '"' : ''}:</p>
                                <div style="font-size: 48px; color: var(--primary); margin: 20px 0;">${accuracy}%</div>
                                <p>Правильных ответов: ${AppState.score} из ${AppState.testResults.length}</p>
                            </div>
                        </div>

                        ${AppState.incorrectAnswers.length > 0 ? `
                        <div class="card fade-in">
                            <h3>📝 Ошибки для повторения:</h3>
                            <div class="test-options">
                                ${AppState.testResults.map((result, index) => {
                                    if (!result.isCorrect && !result.acceptable) {
                                        return `
                                            <div class="result-item incorrect">
                                                <div>
                                                    <strong>${result.word.original}</strong>
                                                    <div style="color: var(--text-light);">${result.word.translation}</div>
                                                    <div style="color: var(--error); font-size: 12px;">Ваш ответ: ${result.selected}</div>
                                                </div>
                                                <div style="color: var(--error);">✗</div>

                                        `;

                                        return `

                                                    <div style="color: var(--warning); font-size: 12px;">Ваш ответ: ${result.selected}</div>
                                                </div>
                                                <div style="color: var(--warning);">⚠</div>
                                            </div>
                                        `;
                                    }
                                    return '';
                                }).join('')}
                            </div>
                        </div>
                        ` : ''}

                        <div class="grid grid-2 fade-in">
                            <button class="btn btn-secondary" onclick="UI.showTestSelection()">
                                📋 Новый тест
                            </button>
                            <button class="btn btn-primary" onclick="${topic ? `UI.showTopicWords('${AppState.currentTopic}')` : 'UI.showTopicsPage()'}">
                                📚 ${topic ? 'Учить тему' : 'Учить слова'}
                            </button>
                        </div>
                    </main>
                `;
            },

            generateNavigation() {
                return `
                    <nav class="navigation">
                        <div class="nav-content">
                            <button class="nav-item" onclick="UI.showMainPage()">
                                <span class="nav-icon">🏠</span>
                                <span>Главная</span>
                            </button>
                            <button class="nav-item" onclick="UI.showTopicsPage()">
                                <span class="nav-icon">📚</span>
                                <span>Темы</span>
                            </button>
                            <button class="nav-item active">
                                <span class="nav-icon">🎯</span>
                                <span>Тест</span>

                            <button class="nav-item" onclick="UI.showDictionary()">
                                <span class="nav-icon">📖</span>
                                <span>Словарь</span>
                            </button>
                        </div>
                    </nav>
                `;

            console.log(`🚀 Инициализация ${APP_CONFIG.name} v${APP_CONFIG.version}`);
            
            // Загрузка данных
            AppState.userProgress = ProgressManager.loadProgress();
            AppState.settings = SettingsManager.loadSettings();
            
            // Инициализация Telegram Web App (если доступно)
            if (typeof Telegram !== 'undefined' && Telegram.WebApp) {
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();
                
                // Получение данных пользователя из Telegram
                const user = Telegram.WebApp.initDataUnsafe?.user;
                if (user) {
                    AppState.user.name = user.first_name || 'Пользователь';
                    if (user.username) {
                        AppState.user.name = `@${user.username}`;
                    }
                }
            }
            
            // Показ главного интерфейса
            setTimeout(() => {
                console.log('✅ Приложение готово!');
                UI.showMainPage();
            }, 1500);
        }

        // ==================== ЗАПУСК ПРИЛОЖЕНИЯ ====================
        // Запуск когда DOM готов
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }

        // ==================== ГЛОБАЛЬНЫЕ ФУНКЦИИ ====================
        // Делаем основные функции глобальными для использования в HTML
        window.UI = UI;
        window.TestSystem = TestSystem;
        window.Utils = Utils;
        window.SettingsManager = SettingsManager;
    </script>
</body>
</html>
