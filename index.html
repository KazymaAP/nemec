<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab Master - Немецкий | Еда и кухня</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: white;
            overflow-x: hidden;
        }
        
        #app {
            min-height: 100vh;
            background: #0a0a0a;
        }
        
        /* Loading */
        .loading {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #0a0a0a;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top: 4px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Header */
        .header {
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            padding: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .logo-text {
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        /* Main Content */
        .main-content {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            padding-bottom: 80px;
        }
        
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
        }
        
        h1 {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 24px;
            margin-bottom: 16px;
        }
        
        h2 {
            color: white;
            font-size: 20px;
            margin-bottom: 16px;
        }
        
        h3 {
            color: white;
            font-size: 18px;
            margin-bottom: 12px;
        }
        
        p {
            color: #b0b0b0;
            line-height: 1.6;
            margin-bottom: 16px;
        }
        
        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            width: 100%;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: white;
        }
        
        .btn-secondary {
            background: #2a2a2a;
            color: white;
            border: 1px solid #333;
        }
        
        .btn-success {
            background: #00ff88;
            color: white;
        }
        
        .btn-danger {
            background: #ff4444;
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        /* Grid */
        .grid {
            display: grid;
            gap: 12px;
            margin-top: 20px;
        }
        
        .grid-2 {
            grid-template-columns: 1fr 1fr;
        }
        
        .grid-3 {
            grid-template-columns: 1fr 1fr 1fr;
        }
        
        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #00d4ff;
        }
        
        .stat-label {
            font-size: 12px;
            color: #666;
        }
        
        /* Navigation */
        .navigation {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a1a;
            border-top: 1px solid #333;
            padding: 8px;
            z-index: 100;
        }
        
        .nav-content {
            display: flex;
            justify-content: space-around;
            align-items: center;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px;
            background: none;
            border: none;
            color: #b0b0b0;
            cursor: pointer;
            font-size: 12px;
            transition: color 0.3s ease;
        }
        
        .nav-item.active {
            color: #00d4ff;
        }
        
        .nav-icon {
            font-size: 20px;
        }
        
        /* Test Styles */
        .test-word {
            text-align: center;
            padding: 30px;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            margin-bottom: 20px;
        }
        
        .test-options {
            display: grid;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .option-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #2a2a2a;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .option-btn:hover {
            background: #333;
        }
        
        .option-btn.correct {
            background: rgba(0, 255, 136, 0.2);
            border-color: #00ff88;
        }
        
        .option-btn.incorrect {
            background: rgba(255, 68, 68, 0.2);
            border-color: #ff4444;
        }
        
        .option-status {
            font-size: 18px;
        }
        
        .test-input {
            width: 100%;
            padding: 15px;
            background: #2a2a2a;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            margin-bottom: 20px;
        }
        
        .test-input.correct {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
        }
        
        .test-input.incorrect {
            border-color: #ff4444;
            background: rgba(255, 68, 68, 0.1);
        }
        
        .test-result {
            text-align: center;
            padding: 20px;
        }
        
        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            background: #2a2a2a;
            border-radius: 6px;
        }
        
        .result-item.correct {
            border-left: 4px solid #00ff88;
        }
        
        .result-item.incorrect {
            border-left: 4px solid #ff4444;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #0099cc);
            transition: width 0.3s ease;
        }
        
        /* Learning */
        .word-card {
            text-align: center;
            padding: 30px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .word-card:hover {
            transform: translateY(-2px);
        }
        
        .word-original {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #00d4ff;
        }
        
        .word-translation {
            font-size: 18px;
            color: #b0b0b0;
        }
        
        .hidden {
            display: none;
        }
        
        /* Topic Cards */
        .topic-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .topic-card:hover {
            transform: translateY(-2px);
            border-color: #00d4ff;
        }
        
        .topic-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .topic-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
            color: white;
        }
        
        .topic-count {
            font-size: 12px;
            color: #666;
        }
        
        /* Media Queries for Mobile */
        @media (max-width: 768px) {
            .main-content {
                padding: 15px;
                padding-bottom: 80px;
            }
            
            .card {
                padding: 16px;
            }
            
            .grid-2, .grid-3 {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            
            .word-original {
                font-size: 24px;
            }
        }
        
        @media (max-width: 480px) {
            .header-content {
                padding: 0 10px;
            }
            
            .main-content {
                padding: 10px;
                padding-bottom: 80px;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .nav-item {
                font-size: 10px;
                padding: 6px;
            }
            
            .nav-icon {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading">
            <div class="spinner"></div>
            <h2 style="margin-top: 20px; color: #00d4ff;">Vocab Master</h2>
            <p style="color: #666; margin-top: 10px;">Загрузка...</p>
        </div>
    </div>

    <script>
        // НОВЫЙ СЛОВАРЬ: только те слова, которые прислал пользователь (еда, кухня, посуда, блюда)
        const wordTopics = {
            food: {
                id: 'food',
                name: '🍽️ Еда и кухня',
                icon: '🍽️',
                words: [
                    { id: 1, original: 'die Milch', translation: 'молоко' },
                    { id: 2, original: 'Vollmilch', translation: 'цельное молоко' },
                    { id: 3, original: 'die Milch aufkochen', translation: 'вскипятить молоко' },
                    { id: 4, original: 'der Zucker', translation: 'сахар' },
                    { id: 5, original: 'das Geschirr', translation: 'посуда' },
                    { id: 6, original: 'der Teller', translation: 'тарелка' },
                    { id: 7, original: 'die Tasse', translation: 'чашка' },
                    { id: 8, original: 'das Glas', translation: 'стакан, рюмка, бокал' },
                    { id: 9, original: 'der Löffel', translation: 'ложка' },
                    { id: 10, original: 'die Gabel', translation: 'вилка' },
                    { id: 11, original: 'das Messer', translation: 'нож' },
                    { id: 12, original: 'die Vorspeise', translation: 'закуска' },
                    { id: 13, original: 'die Suppe', translation: 'суп; первое блюдо' },
                    { id: 14, original: 'die Kohlsuppe', translation: 'щи' },
                    { id: 15, original: 'die Fischsuppe', translation: 'уха' },
                    { id: 16, original: 'das Gericht', translation: 'блюдо (еда)' },
                    { id: 17, original: 'das Hauptgericht', translation: 'основное (второе) блюдо' },
                    { id: 18, original: 'die Nachspeise', translation: 'десерт' },
                    { id: 19, original: 'das Fleisch', translation: 'мясо' },
                    { id: 20, original: 'das Fleischgericht', translation: 'мясное блюдо' },
                    { id: 21, original: 'das Schweinekotelett', translation: 'свиная отбивная' },
                    { id: 22, original: 'das Steak', translation: 'антрекот, стейк' },
                    { id: 23, original: 'der Fisch', translation: 'рыба' },
                    { id: 24, original: 'die Kartoffel', translation: 'картофель (часто во мн. ч.)' },
                    { id: 25, original: 'die Salzkartoffeln', translation: 'вареный картофель' },
                    { id: 26, original: 'die Bratkartoffeln', translation: 'жареный картофель' },
                    { id: 27, original: 'das Kartoffelpüree', translation: 'картофельное пюре' },
                    { id: 28, original: 'die Pommes frites', translation: 'картофель фри' },
                    { id: 29, original: 'die Soße', translation: 'соус' },
                    { id: 30, original: 'das Eis', translation: 'мороженое' },
                    { id: 31, original: 'das Schokoladeneis', translation: 'шоколадное мороженое' },
                    { id: 32, original: 'das Obst', translation: 'фрукты' },
                    { id: 33, original: 'das Gemüse', translation: 'овощи' },
                    { id: 34, original: 'der Salat', translation: 'салат' },
                    { id: 35, original: 'der Fleischsalat', translation: 'мясной салат' },
                    { id: 36, original: 'der Obstsalat', translation: 'фруктовый салат' }
                ]
            }
        };

        // Получить все слова из всех тем
        function getAllWords() {
            let allWords = [];
            for (const topicKey in wordTopics) {
                allWords = allWords.concat(wordTopics[topicKey].words);
            }
            return allWords;
        }

        // Данные приложения
        const appData = {
            currentPage: 'home',
            currentTopic: null,
            user: { name: 'Студент', role: 'user' },
            testMode: null,
            testType: null,
            currentTest: null,
            testResults: [],
            currentWordIndex: 0,
            score: 0,
            incorrectAnswers: [],
            userProgress: loadUserProgress()
        };

        // Загрузка прогресса пользователя
        function loadUserProgress() {
            try {
                const saved = localStorage.getItem('vocabMasterProgress');
                return saved ? JSON.parse(saved) : {
                    learnedWords: [],
                    testResults: [],
                    totalTests: 0,
                    averageScore: 0,
                    topicProgress: {}
                };
            } catch (e) {
                return {
                    learnedWords: [],
                    testResults: [],
                    totalTests: 0,
                    averageScore: 0,
                    topicProgress: {}
                };
            }
        }

        // Сохранение прогресса пользователя
        function saveUserProgress() {
            try {
                localStorage.setItem('vocabMasterProgress', JSON.stringify(appData.userProgress));
            } catch (e) {
                console.error('Не удалось сохранить прогресс:', e);
            }
        }

        // Обновление статистики после теста
        function updateUserStats() {
            appData.userProgress.totalTests++;
            
            const totalScore = appData.userProgress.averageScore * (appData.userProgress.totalTests - 1) + 
                             (appData.score / appData.testResults.length * 100);
            appData.userProgress.averageScore = totalScore / appData.userProgress.totalTests;
            
            appData.userProgress.testResults.push({
                date: new Date().toISOString(),
                score: appData.score,
                total: appData.testResults.length,
                accuracy: Math.round((appData.score / appData.testResults.length) * 100),
                topic: appData.currentTopic,
                type: appData.testType
            });
            
            if (appData.userProgress.testResults.length > 10) {
                appData.userProgress.testResults = appData.userProgress.testResults.slice(-10);
            }
            
            saveUserProgress();
        }

        // Инициализация Telegram
        function initTelegram() {
            if (typeof Telegram !== 'undefined' && Telegram.WebApp) {
                console.log('📱 Telegram Web App detected');
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();
                return true;
            }
            console.log('🖥️ Standalone mode');
            return false;
        }

        // Показать главный интерфейс
        function showMainInterface() {
            console.log('🎯 Showing main interface...');
            
            const totalWords = getAllWords().length;
            
            const app = document.getElementById('app');
            app.innerHTML = `
                <header class="header">
                    <div class="header-content">
                        <div class="logo-text">Vocab Master</div>
                        <div style="color: #00d4ff; font-size: 14px;">👤 ${appData.user.name}</div>
                    </div>
                </header>

                <main class="main-content">
                    <div class="card">
                        <h1>🍽️ Немецкий: еда и кухня</h1>
                        <p>Изучайте немецкие слова по теме «Еда, посуда, блюда» с карточками и тестами</p>
                        
                        <div class="grid">
                            <button class="btn btn-primary" onclick="showTopicsPage()">
                                📚 Изучение слов
                            </button>
                            <button class="btn btn-secondary" onclick="showTestSelection()">
                                🎯 Пройти тест
                            </button>
                            <button class="btn btn-secondary" onclick="showPage('dictionary')">
                                📖 Весь словарь
                            </button>
                        </div>
                    </div>

                    <div class="card">
                        <h3>Статистика</h3>
                        <div class="stats-grid">
                            <div class="stat">
                                <div class="stat-value">${totalWords}</div>
                                <div class="stat-label">Слов</div>
                            </div>
                            <div class="stat">
                                <div class="stat-value">${Object.keys(wordTopics).length}</div>
                                <div class="stat-label">Тем</div>
                            </div>
                            <div class="stat">
                                <div class="stat-value">${Math.round(appData.userProgress.averageScore)}%</div>
                                <div class="stat-label">Успех</div>
                            </div>
                        </div>
                    </div>
                    
                    ${appData.userProgress.testResults.length > 0 ? `
                    <div class="card">
                        <h3>Последние результаты</h3>
                        <div class="test-options">
                            ${appData.userProgress.testResults.slice(-3).reverse().map(result => `
                                <div class="result-item ${result.accuracy >= 70 ? 'correct' : 'incorrect'}">
                                    <div>
                                        <strong>${result.accuracy}%</strong>
                                        <div style="color: #666;">${new Date(result.date).toLocaleDateString()}</div>
                                        <div style="color: #666; font-size: 10px;">${getTestTypeDescription(result.type)}</div>
                                    </div>
                                    <div>${result.score}/${result.total}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    ` : ''}
                </main>

                <nav class="navigation">
                    <div class="nav-content">
                        <button class="nav-item active" onclick="showPage('home')">
                            <span class="nav-icon">🏠</span>
                            <span>Главная</span>
                        </button>
                        <button class="nav-item" onclick="showTopicsPage()">
                            <span class="nav-icon">📚</span>
                            <span>Темы</span>
                        </button>
                        <button class="nav-item" onclick="showTestSelection()">
                            <span class="nav-icon">🎯</span>
                            <span>Тест</span>
                        </button>
                        <button class="nav-item" onclick="showPage('dictionary')">
                            <span class="nav-icon">📖</span>
                            <span>Словарь</span>
                        </button>
                    </div>
                </nav>
            `;
        }

        // Показать страницу с темами (у нас одна тема)
        function showTopicsPage() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <header class="header">
                    <div class="header-content">
                        <div class="logo-text">📚 Темы для изучения</div>
                        <button onclick="showPage('home')" style="background: none; border: none; color: #00d4ff; cursor: pointer;">← Назад</button>
                    </div>
                </header>

                <main class="main-content">
                    <div class="card">
                        <h2>Выберите тему</h2>
                        <p>Изучайте слова по тематическим группам</p>
                        
                        <div class="grid grid-2">
                            ${Object.values(wordTopics).map(topic => `
                                <div class="topic-card" onclick="showTopicWords('${topic.id}')">
                                    <div class="topic-icon">${topic.icon}</div>
                                    <div class="topic-name">${topic.name}</div>
                                    <div class="topic-count">${topic.words.length} слов</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="card">
                        <button class="btn btn-primary" onclick="showLearnPage()">
                            📚 Все слова сразу
                        </button>
                    </div>
                </main>

                <nav class="navigation">
                    <div class="nav-content">
                        <button class="nav-item" onclick="showPage('home')">
                            <span class="nav-icon">🏠</span>
                            <span>Главная</span>
                        </button>
                        <button class="nav-item active">
                            <span class="nav-icon">📚</span>
                            <span>Темы</span>
                        </button>
                        <button class="nav-item" onclick="showTestSelection()">
                            <span class="nav-icon">🎯</span>
                            <span>Тест</span>
                        </button>
                        <button class="nav-item" onclick="showPage('dictionary')">
                            <span class="nav-icon">📖</span>
                            <span>Словарь</span>
                        </button>
                    </div>
                </nav>
            `;
        }

        // Показать слова конкретной темы
        function showTopicWords(topicId) {
            const topic = wordTopics[topicId];
            appData.currentTopic = topicId;
            
            const app = document.getElementById('app');
            app.innerHTML = `
                <header class="header">
                    <div class="header-content">
                        <div class="logo-text">${topic.icon} ${topic.name}</div>
                        <button onclick="showTopicsPage()" style="background: none; border: none; color: #00d4ff; cursor: pointer;">← Назад</button>
                    </div>
                </header>

                <main class="main-content">
                    <div class="card">
                        <h2>${topic.name}</h2>
                        <p>Нажмите на карточку, чтобы увидеть перевод</p>
                        
                        <div class="grid">
                            ${topic.words.map(word => `
                                <div class="card word-card" onclick="showWordTranslation(${word.id})">
                                    <div class="word-original">${word.original}</div>
                                    <div class="word-translation hidden" id="translation-${word.id}">${word.translation}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="grid grid-2">
                        <button class="btn btn-secondary" onclick="showTopicTestSelection('${topicId}')">
                            🎯 Тест по теме
                        </button>
                        <button class="btn btn-primary" onclick="showTopicsPage()">
                            📚 Другие темы
                        </button>
                    </div>
                </main>

                <nav class="navigation">
                    <div class="nav-content">
                        <button class="nav-item" onclick="showPage('home')">
                            <span class="nav-icon">🏠</span>
                            <span>Главная</span>
                        </button>
                        <button class="nav-item active">
                            <span class="nav-icon">📚</span>
                            <span>Темы</span>
                        </button>
                        <button class="nav-item" onclick="showTestSelection()">
                            <span class="nav-icon">🎯</span>
                            <span>Тест</span>
                        </button>
                        <button class="nav-item" onclick="showPage('dictionary')">

        function getTestTypeDescription(type) {
            switch(type) {
                case 'choice': return 'Тест с выбором ответа';
                case 'writing': return 'Письменный тест';
                case 'reverse': return 'Перевод с русского на немецкий';
                default: return 'Тест';
            }
        }

        function startTest(mode, topicId = null) {
            appData.testMode = mode;
            
            if (topicId) {
                appData.currentTest = shuffleArray([...wordTopics[topicId].words]);
                appData.currentTopic = topicId;
            } else if (mode === 'difficult') {
                appData.currentTest = shuffleArray(getAllWords()).slice(0, 10);
                appData.currentTopic = 'all';
            } else {
                appData.currentTest = shuffleArray(getAllWords());
                appData.currentTopic = 'all';
            }
            
            appData.currentWordIndex = 0;
            appData.score = 0;
            appData.incorrectAnswers = [];
            appData.testResults = [];
            
            showTestQuestion();
        }

        function showTestQuestion() {
            if (appData.currentWordIndex >= appData.currentTest.length) {
                if (appData.testMode === 'untilCorrect' && appData.incorrectAnswers.length > 0) {
                    appData.currentTest = [...appData.incorrectAnswers];
                    appData.currentWordIndex = 0;
                    appData.incorrectAnswers = [];
                } else {
                    updateUserStats();
                    showTestResults();
                    return;
                }
            }
            
            const currentWord = appData.currentTest[appData.currentWordIndex];
            
            if (appData.testType === 'choice') {
                showChoiceTest(currentWord);
            } else if (appData.testType === 'writing') {
                showWritingTest(currentWord);
            } else if (appData.testType === 'reverse') {
                showReverseTest(currentWord);
            }
        }

        function showChoiceTest(word) {
            const options = [word.translation];
            const allWords = appData.currentTopic && appData.currentTopic !== 'all' ? 
                wordTopics[appData.currentTopic].words : getAllWords();
            
            const otherWords = allWords
                .filter(w => w.id !== word.id)
                .sort(() => Math.random() - 0.5)
                .slice(0, 3)
                .map(w => w.translation);
            
            const allOptions = shuffleArray([...options, ...otherWords]);
            
            const topic = appData.currentTopic && appData.currentTopic !== 'all' ? 
                wordTopics[appData.currentTopic] : null;
            
            const app = document.getElementById('app');
            app.innerHTML = `
                <header class="header">
                    <div class="header-content">
                        <div class="logo-text">${topic ? topic.icon + ' ' + topic.name : '📝 Тест'}</div>

                    <div class="test-word">
                        <h1 style="font-size: 36px; margin-bottom: 10px;">${word.original}</h1>
                        <p style="color: #666;">Переведите на русский</p>
                    </div>

                    <div class="test-options" id="options-container">
                        ${allOptions.map(option => `
                            <button class="option-btn" onclick="checkChoiceAnswer('${option.replace(/'/g, "\\'")}', '${word.translation.replace(/'/g, "\\'")}')">
                                <span>${option}</span>
                                <span class="option-status"></span>
                            </button>
                        `).join('')}

                    </div>
                </nav>
            `;
        }

        function checkChoiceAnswer(selected, correct) {
            const options = document.querySelectorAll('.option-btn');
            const nextBtn = document.getElementById('next-btn');
            
            options.forEach(option => {
                const optionText = option.querySelector('span:first-child').textContent;
                const status = option.querySelector('.option-status');
                option.style.pointerEvents = 'none';
                if (optionText === correct) {
                    option.classList.add('correct');
                    status.textContent = '✓';
                    status.style.color = '#00ff88';
                }
                if (optionText === selected && optionText !== correct) {
                    option.classList.add('incorrect');
                    status.textContent = '✗';
                    status.style.color = '#ff4444';
                }
            });
            
            const isCorrect = selected === correct;
            appData.testResults.push({
                word: appData.currentTest[appData.currentWordIndex],
                selected,
                correct,
                isCorrect
            });
            
            if (isCorrect) appData.score++;
            else appData.incorrectAnswers.push(appData.currentTest[appData.currentWordIndex]);
            
            nextBtn.classList.remove('hidden');
        }

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }
